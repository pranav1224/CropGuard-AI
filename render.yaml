services:
  # 1. Full-Stack Express Backend & API Gateway
  - type: web
    name: cropguard-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false

  # 2. Python Streamlit 3D AI Platform (Docker Container)
  - type: web
    name: cropguard-streamlit-ai
    env: docker
    plan: free
    dockerfilePath: Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: 8501
